<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEALTH FIGHTER // TACTICAL STRIKE SIM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="viewport-wrapper">
    <canvas id="flightRenderCanvas" width="1000" height="580"></canvas>

    <!-- Mobile controls -->
    <div id="mobile-controls">
        <div class="mc-row">
            <button class="mc-btn" data-key="w">▲</button>
        </div>
        <div class="mc-row">
            <button class="mc-btn" data-key="a">◀</button>
            <button class="mc-btn" data-key="s">▼</button>
            <button class="mc-btn" data-key="d">▶</button>
        </div>
        <div class="mc-row">
            <button class="mc-btn mc-fire" data-key=" ">GUN</button>
            <button class="mc-btn mc-missile" data-key="q">A2G</button>
            <button class="mc-btn mc-flare" data-key="f">CM</button>
        </div>
    </div>
</div>

<div id="system-dashboard">
    <div>[ TACTICAL FLIGHT CONTROL SUITE v9.41 ]</div>
    <div>
        CONTROLS:
        <span class="hud-highlight">W / S</span> Pitch |
        <span class="hud-highlight">A / D</span> Bank Left/Right |
        <span class="hud-highlight">SPACE</span> Vulcan Cannon |
        <span class="hud-highlight">Q</span> A2G Missiles |
        <span class="hud-highlight">F</span> Countermeasures
    </div>
    <div>TACTICAL DATA ENGINE: <span id="dash-perf">-- FPS</span></div>
</div>

<script src="script.js"></script>
</body>
</html>
